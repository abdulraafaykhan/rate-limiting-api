# Starts Redis, two identical API copies and an Nginx load balancer.
#   api1 -> http://localhost:8001
#   api2 -> http://localhost:8002
#   nginx -> http://localhost:8000 (alternates between api1 and api2)

services:
  redis:
    image: redis:7
    # appendonly keeps the data on disk, so it survives a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api1:
    build: .
    ports:
      - "8001:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-secret-key}
      RATE_LIMIT_ALGORITHM: ${RATE_LIMIT_ALGORITHM:-sliding_window_log}
      INSTANCE_ID: api1
    depends_on:
      redis:
        condition: service_healthy

  api2:
    build: .
    ports:
      - "8002:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-secret-key}
      RATE_LIMIT_ALGORITHM: ${RATE_LIMIT_ALGORITHM:-sliding_window_log}
      INSTANCE_ID: api2
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  redis_data:
