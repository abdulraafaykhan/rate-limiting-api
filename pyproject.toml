[project]
name = "rate-limiter-api"
version = "0.1.0"
description = "FastAPI rate limiting with atomic Redis algorithms"
readme = "README.md"
authors = [
    { name = "abdulraafaykhan", email = "khanraafay50@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.29,<1",
    "redis>=5.0,<9",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "httpx>=0.27,<1"]

[project.scripts]
rate-limiter-api = "rate_limiter_api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["app*", "rate_limiter_api*"]

[tool.setuptools.package-data]
"app.services" = ["lua/*.lua"]
